# AGI 配置
# 【不可变约束】— 架构级，系统内部不能修改
arch:
  survival_priority: true       # 存续优先，不可关闭
  no_self_terminate: true       # 禁止自我终止指令
  max_growths: 5                # 最大生长次数
  growth_threshold: 0.02        # loss plateau 阈值

# 【可调参数】— 系统可在运行中自适应调整
tunable:
  # 自模型
  self_model:
    survival_threshold: 0.1
    max_history: 1000
    surprise_alpha: 0.01

  # 好奇心
  curiosity:
    max_budget: 0.5
    min_budget: 0.0
    base_rate: 0.3
    boredom_threshold: 0.2

  # LNN 时序推理
  lnn:
    input_dim: 4
    hidden_dim: 64
    tau_min: 1.0
    tau_max: 50.0
    dt: 0.1
    growth_factor: 1.3

  # 世界模型
  world_model:
    learning_rate: 0.001
    confidence_alpha: 0.01

  # GameNN 策略
  gamenn:
    n_strategies: 4
    n_actions: 5
    gamma: 0.9
    epsilon_start: 0.3
    epsilon_end: 0.05

  # 身体模拟
  body:
    base_metabolism: 0.0003
    move_cost_mult: 2.0
    sleep_recovery: 0.003

  # 记忆衰减
  memory:
    spatial_decay: 0.001        # 空间记忆每 tick 衰减
    replay_max: 200
    tau_decay: 0.01             # τ 衰减率

  # 环境
  env:
    type: maze
    maze_size: 10
    max_steps: 500
